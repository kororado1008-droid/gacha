<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易画像ガチャ</title>
    <style>
        /* スマホで見やすいようにスタイルを調整 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }

        #gacha-container {
            text-align: center;
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            display: none; /* 画像読み込みまでは非表示 */
            border: 2px solid #ddd;
        }

        h1 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .btn:active {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div id="gacha-container">
        <h1>本日のガチャ結果</h1>
        
        <img id="result-image" src="" alt="ガチャ画像">
        
        <br>
        <button class="btn" onclick="location.reload()">もう一度引く</button>
    </div>

    <script>
        // ==========================================
        // 【設定エリア】ここに画像のURLまたはファイル名を10個入れてください
        // ==========================================
        const imageList = [
            "image1.jpg",
            "image2.jpg",
            "image3.jpg",
            "image4.jpg",
            "image5.jpg",
            "image6.jpg",
            "image7.jpg",
            "image8.jpg",
            "image9.jpg",
            "image10.jpg"
        ];

        // ==========================================
        // ガチャのロジック
        // ==========================================
        function drawGacha() {
            // ランダムな数字（0〜9）を選ぶ
            const randomIndex = Math.floor(Math.random() * imageList.length);
            
            // 選ばれた画像をセットする
            const imgElement = document.getElementById('result-image');
            imgElement.src = imageList[randomIndex];
            
            // 画像を表示する
            imgElement.style.display = 'inline-block';
        }

        // ページが読み込まれた瞬間に実行
        window.onload = drawGacha;
    </script>
</body>
</html>
