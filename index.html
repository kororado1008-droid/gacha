<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お楽しみガチャ</title>
    <style>
        /* 全体のレイアウト */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8; /* 背景色を少し明るく */
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        #gacha-container {
            text-align: center;
            width: 90%;
            max-width: 400px; /* スマートフォン向けに少し幅を狭く */
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden; /* アニメーションのはみ出し防止 */
        }

        h1 {
            font-size: 1.4rem;
            color: #333;
            margin: 0 0 20px 0;
        }

        /* --- アニメーション演出エリア --- */
        #stage {
            height: 300px; /* 画像が表示されるエリアの高さ */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
        }

        /* 1. 抽選中のカプセル（CSSで描画） */
        .capsule-container {
            position: absolute;
            animation: shake 0.5s infinite linear; /* ずっと揺らす */
        }
        .capsule-body {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53); /* 赤系のグラデーション */
            border-radius: 50%;
            border: 8px solid #fff;
            box-shadow: inset 0 -10px 20px rgba(0,0,0,0.2), 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            color: white;
            font-weight: bold;
        }
        /* 揺れるアニメーションの定義 */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 3px) rotate(-5deg); }
            50% { transform: translate(0, -3px) rotate(0deg); }
            75% { transform: translate(5px, 3px) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 2. 結果画像 */
        #result-image {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            
            /* 初期状態：隠しておく */
            opacity: 0;
            transform: scale(0.3) rotate(-20deg);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); /* ポンッと出るバネのような動き */
        }

        /* 結果が表示される時のクラス */
        #result-image.show {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        /* 非表示にするためのユーティリティクラス */
        .hidden {
            display: none !important;
        }

        /* --- ボタン --- */
        .btn {
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
            background-color: #2980b9;
        }
        /* 抽選中はボタンを押せなくする */
        .btn:disabled {
            background-color: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
        }

    </style>
</head>
<body>

    <div id="gacha-container">
        <h1>🎁 本日のガチャ 🎁</h1>
        
        <div id="stage">
            <div id="capsule" class="capsule-container">
                <div class="capsule-body">?</div>
            </div>
            
            <img id="result-image" src="" alt="ガチャ結果">
        </div>
        
        <button id="retry-btn" class="btn" onclick="playGacha()">ガチャを引く！</button>
    </div>

    <script>
        // ==========================================
        // 【設定エリア】画像ファイル名を指定（3枚版）
        // ==========================================
        const imageList = [
            "1.png",
            "2.png",
            "3.png"
        ];
        // ==========================================

        // 要素を取得
        const capsule = document.getElementById('capsule');
        const resultImage = document.getElementById('result-image');
        const retryBtn = document.getElementById('retry-btn');

        // ガチャを実行する関数
        function playGacha() {
            // 1. 状態をリセット（演出開始）
            retryBtn.disabled = true; // ボタンを無効化
            retryBtn.textContent = "抽選中..."; // ボタンの文字を変える
            capsule.classList.remove('hidden'); // カプセルを表示
            resultImage.classList.remove('show'); // 結果画像を隠す
            
            // 抽選を行う
            const randomIndex = Math.floor(Math.random() * imageList.length);
            const selectedImageSrc = imageList[randomIndex];

            // 画像を裏で先に読み込んでおく（表示時のちらつき防止）
            const preloadImg = new Image();
            preloadImg.src = selectedImageSrc;

            // 2. アニメーション待機（2秒間カプセルが揺れる）
            setTimeout(() => {
                // 画像をセット
                resultImage.src = selectedImageSrc;
                
                // カプセルを隠す
                capsule.classList.add('hidden');
                
                // 結果画像にアニメーション用のクラスを付ける（ポンッと表示）
                resultImage.classList.add('show');
                
                // ボタンを元に戻す
                retryBtn.disabled = false;
                retryBtn.textContent = "もう一度引く";

            }, 2000); // ここで待ち時間（ミリ秒）を変更できます。2000 = 2秒
        }

        // ページが読み込まれたら自動で1回目を引く
        window.onload = playGacha;

    </script>
</body>
</html>
